# ============================================================
# Global Settings
# ============================================================

settings:
  anomaly_detection:
    sentiment_drop_threshold: 0.3
    issue_spike_threshold: 2.0
    min_reviews_for_trend: 5
    lookback_days: 7
  alert_severity:
    critical: 5
    high: 4
    medium: 3
    low: 2
    info: 1
  processing:
    batch_size: 50
    max_retries: 3
    retry_delay_seconds: 2
